<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Themed Ecommerce Website - 3am</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="nav-cont">
            <a href="#" class="logo" onclick="showPage('home')">BuyToSpook</a>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search to spook...">
                <button onclick="searchProducts()">Search</button>
            </div>

            <div class="nav-actions">
                <a href="#" class="nav-btn" onclick="showPage('account')">🧟‍♂️ Account</a>
                <a href="#" class="nav-btn" onclick="showPage('cart')">🛒 Cart (<span id="cartCount">0</span>)</a>
                <a href="#" class="nav-btn" onclick="showPage('orders')">📦 Order</a>
            </div>
            <button class="mobile-menu-btn">
                ☰
            </button>
        </div>
    </header>

    <div class="sidebar-overlay">

    </div>
    <div class="sidebar">
        <button class="close-siderbar">
            ❌
        </button>
        <ul class="sidebar-menu">
            <li>
                <a href="#" onclick="showPage('account')">🧟‍♂️ Account</a>
            </li>
            <li>
                <a href="#" onclick="showPage('account')">🛒 Cart</a>
            </li>
            <li>
                <a href="#" onclick="showPage('account')">📦 Orders</a>
            </li>
        </ul>
    </div>

    <main class="main-content">
        <div id="homePage" class="page">
            <section class="hero">
                <div class="hero-content">
                    <h1>Welcome To BuyToSpook</h1>
                    <p>Dark theme Ecommerce Store for midnighters...</p>
                    <a href="#categories" class="hero-btn">Shop Now</a>
                </div>
            </section>
            <section class="categories" id="categories">
                <div class="container">
                    <h2>
                        Shop by Category
                    </h2>
                    <div class="category-grid" id="categoryGrid">

                    </div>
                </div>
            </section>
        </div>

        <div id="categoryPage" class="page hidden">
            <div class="container">
                <h1 id="categoryTitle">
                    Products
                </h1>
                <div class="filter-section">
                    <div class="filter-row">
                        <div class="filter-group">
                            <label for="sortBy">Sort By:</label>
                            <select id="sortBy" onchange="applyFilters()">
                                <option value="relevance">Relevance</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Rating</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="priceRange">Max Price:</label>
                            <input type="range" id="priceRange" min="0" max="10000" value="10000"
                                onchange="applyFilters()">
                            <span id="priceValue">$10000</span>
                        </div>
                        <div class="filter-group">
                            <label for="brandFilter">Brand</label>

                            <select id="brandFilter" onchange="applyFilters()">
                                <option value="">All Brands</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="product-grid" id="productGrid">

                </div>
            </div>
        </div>

        <div id="productPage" class="page hidden">
            <div class="container">
                <div class="product-detail" id="productDetail">

                </div>
            </div>
        </div>

        <div id="cartPage" class="page hidden">
            <div class="container">
                <h1>
                    My Cart
                </h1>
                <div id="cartItems">

                </div>
                <div class="cart-summary" id="cartSummary">

                </div>
            </div>
        </div>

        <div id="orderPage" class="page hidden">
            <div class="container">
                <h1>
                    Place Order
                </h1>
                <div id="orderSteps">

                </div>
            </div>
        </div>

        <div id="ordersPage" class="page hidden">
            <div class="container">
                <h1>My orders</h1>
                <div id="ordersList">

                </div>
            </div>
        </div>
        
        <div id="accountPage" class="page hidden">
            <div class="container">
                <h1>My Account</h1>
                <div class="order-form">
                    <h2>Personal Inforamtion</h2>
                    <div class="form-group">
                        <label for="userName">Name:</label>
                        <input type="text" id="userName" placeholder="Enter your name">
                    </div> 
                    <div class="form-group">
                        <label for="userEmail">Email:</label>
                        <input type="email" id="userEmail" placeholder="Enter your email">
                    </div> 
                    <div class="form-group">
                        <label for="userPhone">userPhone:</label>
                        <input type="text" id="userPhone" placeholder="Enter your phone number">
                    </div> 
                    <div class="form-group">
                        <label for="userAddress">Address:</label>
                        <textarea id="userAddress" placeholder="Enter your address">
                    </div> 
                    <button class="btn-primary" onclick="saveUserInfo()">
                        Save Information
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
